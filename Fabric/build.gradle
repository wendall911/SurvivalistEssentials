plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

def identifier = "${mod_id}-${minecraft_version}-fabric"
def modLoader = "${project.name}".toUpperCase()
version = "${version}-${modLoader}"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-fabric", version: "${whitenoise_version}"
    include group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-fabric", version: "${whitenoise_version}"

    implementation group: 'technology.roughness.handbook', name: "handbook-${minecraft_version}-fabric", version: "${handbook_version}"
    include group: 'technology.roughness.handbook', name: "handbook-${minecraft_version}-fabric", version: "${handbook_version}"

/*
    runtimeOnly "dev.architectury:architectury-fabric:${architectury_version}"
    runtimeOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
*/
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}"
    /*
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    */

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"

    compileOnly "curse.maven:carryon-274259:${carryon_fabric_version}"

    runtimeOnly group: 'com.terraformersmc', name: 'modmenu', version: "${mod_menu_version}"

    // Testing Mods
    //runtimeOnly "curse.maven:carryon-274259:${carryon_fabric_version}"
    runtimeOnly "curse.maven:jade-324717:${jade_fabric_version}"
    //runtimeOnly "curse.maven:mod-XXX:XXX"
    // Beach crashes in a dev environment.
    // Let's NOT Do architectury please
    //runtimeOnly "curse.maven:letsdo_beach-858691:${letsdo_beach_fabric_version}"
    //runtimeOnly "dev.emi:trinkets:${trinkets_version}"
    //runtimeOnly "curse.maven:letsdo_blooming-962885:${letsdo_blooming_fabric_version}"
    //runtimeOnly "curse.maven:letsdo_meadow-821483:${letsdo_meadow_fabric_version}"
    //runtimeOnly "curse.maven:letsdo_farm-1038103:${letsdo_farm_fabric_version}"
    //runtimeOnly "curse.maven:letsdo_vinery-704465:${letsdo_vinery_fabric_version}"
    //runtimeOnly "curse.maven:letsdo_wilder-1071657:${letsdo_wilder_fabric_version}"
}

loom {
    def aw = project(":Common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        commonDatagen {
            client()
            setConfigName("${mod_name} Common Datagen")
            vmArg "-D${mod_id}.common_datagen=1"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("../Common/src/generated/resources")}"
        }
        fabricDatagen {
            inherit client
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    from ('../NeoForge/src/generated/resources/') {
        exclude '**/recipe/*'
        exclude '**/recipes/*'
        exclude '**/neoforge/*'
    }
}

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/Fabric/build/libs/${identifier}-${version}.jar"
def display_name = "${project.name} ${minecraft_version}-${version}"
def display_version = "${minecraft_version}-${version}"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    displayName = "${display_name}"
    version = "${display_version}"
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.add('fabric')
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty("${curseforge_api_key_prop}")) {
        curseforge {
            accessToken = project.property("${curseforge_api_key_prop}")
            projectId = "${curseforge_id}"
            projectSlug = "${curseforge_slug}"
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('fabric-api')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks')
            optional('homeostatic')
            optional('simpletextoverlay')
            optional('ready-player-fun')
            optional('lets-do-beachparty')
            optional('lets-do-bloomingnature')
            optional('lets-do-meadow')
            optional('lets-do-farm-charm')
            optional('lets-do-vinery')
            optional('lets-do-wildernature')
        }
    }
    if (project.hasProperty("${modrinth_api_key_prop}")) {
        modrinth {
            accessToken = project.property("${modrinth_api_key_prop}")
            projectId = "${modrinth_id}"
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('fabric-api')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks-mod')
            optional('homeostatic')
            optional('simpletextoverlay')
            optional('ready-player-fun')
            optional('lets-do-beachparty')
            optional('lets-do-bloomingnature')
            optional('lets-do-meadow')
            optional('lets-do-farm-charm')
            optional('lets-do-vinery')
            optional('lets-do-wildernature')
        }
    }
    if (project.hasProperty("${discord_webhook_prop}")) {
        discord {
            webhookUrl = project.property("${discord_webhook_prop}")
            dryRunWebhookUrl = project.property("${discord_dryrun_webhook_prop}")
            username = "${mod_author}"
            content = changelog.map {
                "# A new version of ${mod_display_name} for Fabric ${minecraft_version} has been released! \n" + it
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId identifier
            version project.version
            from components.java
        }
    }
}
